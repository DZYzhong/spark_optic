name: CI

on:
  push:
    branches: [ main, master, codex/* ]
  pull_request:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          # Run pip install with verbose logging and capture output for debugging
          set -o pipefail
          python -m pip install . 2>&1 | tee ci-pip-install.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "pip install failed — printing log:"; cat ci-pip-install.log; exit 1
          fi
          pip install pytest

      - name: Run pytest
        run: |
          pytest -q

  smoke:
    name: Smoke check (demo mode)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          # Run pip install with verbose logging and capture output for debugging
          set -o pipefail
          python -m pip install . 2>&1 | tee ci-pip-install.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "pip install failed — printing log:"; cat ci-pip-install.log; exit 1
          fi

      - name: Start app (demo mode)
        env:
          SPARK_OPTIC_MODE: demo
        run: |
          nohup python -m uvicorn spark_optic.app:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          # wait for server
          for i in {1..20}; do
            if curl -sSf http://127.0.0.1:8000/ > /dev/null; then
              echo 'server up'
              break
            fi
            sleep 1
          done
          sleep 1

      - name: Run smoke_check
        run: |
          python3 scripts/smoke_check.py
